<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meus decks de Commander</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#121214; color:#f0efec; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .bar { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:8px; padding:0 12px; padding-top:env(safe-area-inset-top); background:#1a1a19; border-bottom:1px solid #33332f; z-index:10; }
  .bar .t { font-weight:700; margin-right:auto; font-size:15px; white-space:nowrap; }
  .bar button { background:#232321; color:#f0efec; border:1px solid #33332f; border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .bar button.on { background:#3987e5; border-color:#3987e5; color:#fff; }
  iframe { position:fixed; top:calc(52px + env(safe-area-inset-top)); left:0; width:100%; height:calc(100% - 52px - env(safe-area-inset-top)); border:0; display:none; background:#121214; }
  iframe.on { display:block; }
  @media (max-width:420px) { .bar .t { display:none; } .bar { justify-content:center; } }
</style>
</head>
<body>
<div class="bar">
  <span class="t">Meus decks</span>
  <button data-deck="alela">Fadas · Alela</button>
  <button data-deck="millicent">Espíritos · Millicent</button>
</div>
<iframe id="f-alela" title="Deck de Fadas (Alela)"></iframe>
<iframe id="f-millicent" title="Deck de Espíritos (Millicent)"></iframe>
<script>
// Cada painel fica guardado aqui e só é carregado quando a aba é aberta.
const PAGES = { alela: "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Alela, Cunning Conqueror: painel do deck<\/title>\n<style>\n  :root {\n    color-scheme: dark;\n    --bg:#121214; --surface-1:#1a1a19; --surface-2:#232321; --line:#33332f;\n    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;\n    --series-1:#3987e5; --series-7:#9085e9; --series-3:#199e70;\n    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;\n    --accent:#3987e5;\n  }\n  * { box-sizing:border-box; }\n  body { margin:0; font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif; background:var(--bg); color:var(--text-primary); }\n  .wrap { max-width:1360px; margin:0 auto; padding:24px; }\n  h1 { margin:0 0 4px; font-size:28px; }\n  h2 { font-size:18px; margin:0 0 12px; }\n  .sub { color:var(--text-secondary); margin:0; }\n  .muted { color:var(--text-muted); font-size:13px; }\n  .status { margin-top:12px; padding:10px 14px; border-radius:8px; background:var(--surface-2); color:var(--text-secondary); }\n  .status.err { border-left:3px solid var(--critical); }\n\n  /* KPIs */\n  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin:20px 0; }\n  .kpi { background:var(--surface-1); border:1px solid var(--line); border-radius:10px; padding:14px; }\n  .kpi .label { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }\n  .kpi .value { font-size:28px; font-weight:700; margin-top:4px; }\n  .kpi .note { font-size:12px; color:var(--text-secondary); margin-top:2px; }\n\n  /* Panels */\n  .panels { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr)); gap:16px; }\n  .panel { background:var(--surface-1); border:1px solid var(--line); border-radius:10px; padding:18px; }\n\n  /* Vertical bars (curve) */\n  .vbars { display:flex; align-items:flex-end; gap:8px; height:180px; border-bottom:1px solid var(--line); padding-top:18px; }\n  .vbar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:default; }\n  .vbar .bar { width:70%; background:var(--series-1); border-radius:4px 4px 0 0; min-height:2px; }\n  .vbar .num { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }\n  .vlabels { display:flex; gap:8px; margin-top:6px; }\n  .vlabels div { flex:1; text-align:center; font-size:12px; color:var(--text-muted); }\n\n  /* Horizontal bars */\n  .hbars { display:flex; flex-direction:column; gap:7px; }\n  .hrow { display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:8px; font-size:13px; cursor:default; }\n  .hrow .track { background:var(--surface-2); border-radius:4px; height:14px; overflow:hidden; }\n  .hrow .fill { height:100%; background:var(--series-1); border-radius:0 4px 4px 0; }\n  .hrow .n { text-align:right; color:var(--text-secondary); }\n\n  /* Color balance */\n  .balance { display:flex; flex-direction:column; gap:14px; }\n  .split { display:flex; height:22px; border-radius:5px; overflow:hidden; gap:2px; }\n  .split div { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; }\n  .legend { display:flex; gap:14px; font-size:13px; color:var(--text-secondary); margin-bottom:6px; }\n  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }\n\n  /* Power */\n  .power-score { display:flex; align-items:baseline; gap:10px; }\n  .power-score .big { font-size:44px; font-weight:800; }\n  .factors { list-style:none; padding:0; margin:12px 0 0; font-size:13px; }\n  .factors li { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); color:var(--text-secondary); }\n  .factors li b { color:var(--text-primary); }\n\n  /* Toolbar */\n  .toolbar { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line); }\n  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }\n  input[type=search], select, input[type=number] { background:var(--surface-2); color:var(--text-primary); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:14px; }\n  input[type=search] { min-width:240px; }\n  .chip { background:var(--surface-2); border:1px solid var(--line); color:var(--text-secondary); border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; user-select:none; }\n  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .chip .c { opacity:.75; margin-left:4px; }\n  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px; font-size:14px; cursor:pointer; }\n  button.ghost { background:var(--surface-2); color:var(--text-primary); border:1px solid var(--line); }\n  .group-label { font-size:12px; color:var(--text-muted); min-width:58px; }\n\n  /* Cards */\n  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; margin-top:14px; }\n  .card { position:relative; text-decoration:none; color:inherit; }\n  .card img { width:100%; aspect-ratio:488/680; border-radius:4.75% / 3.5%; background:var(--surface-2); display:block; transition:transform .15s; }\n  .card:hover img { transform:scale(1.04); }\n  .card .meta { font-size:12px; margin-top:5px; color:var(--text-secondary); display:flex; justify-content:space-between; gap:6px; }\n  .badge { position:absolute; top:8px; right:8px; background:var(--accent); color:#fff; font-weight:700; border-radius:999px; padding:2px 9px; font-size:13px; }\n  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }\n  .tag { font-size:11px; background:var(--surface-2); color:var(--text-secondary); border-radius:4px; padding:1px 6px; }\n  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }\n  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }\n  th { color:var(--text-muted); font-weight:600; cursor:pointer; position:sticky; top:0; }\n  td a { color:var(--text-primary); }\n\n  /* Hand */\n  .hand { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:12px; }\n  .hand img { width:100%; border-radius:4.75% / 3.5%; }\n  .probs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:8px; }\n  .prob { background:var(--surface-2); border-radius:8px; padding:10px; }\n  .prob b { font-size:22px; display:block; }\n\n  textarea { width:100%; height:300px; background:#0e0e10; color:var(--text-primary); border:1px solid var(--line); border-radius:6px; padding:10px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }\n  section { margin-top:28px; }\n\n\n  .budget-btns { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }\n  .budget-btns button { background:var(--surface-2); border:1px solid var(--line); color:var(--text-primary); min-width:96px; }\n  .budget-btns button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .tiers { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }\n  .tiers td, .tiers th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }\n  .ok { color:var(--good); } .bad { color:var(--critical); }\n  .card .rm { position:absolute; top:8px; left:8px; background:#000b; color:#fff; border:0; border-radius:999px; width:26px; height:26px; padding:0; font-size:15px; line-height:26px; display:none; }\n  .card:hover .rm { display:block; }\n  .editor { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:16px; }\n  .diff { font-size:13px; line-height:1.7; }\n  .diff .in { color:var(--good); } .diff .out { color:var(--critical); }\n  .pill { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--surface-2); font-size:13px; }\n  .loader { position:fixed; top:0; left:0; right:0; height:4px; background:transparent; z-index:100; }\n  .loader div { height:100%; width:0; background:var(--accent); transition:width .25s; }\n  .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }\n  .spin { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 0.8s linear infinite; flex:none; }\n  @keyframes sp { to { transform:rotate(360deg); } }\n  .status.loading { border-left:3px solid var(--accent); }\n  .status.done { border-left:3px solid var(--good); }\n  .status button { padding:5px 12px; font-size:13px; }\n  body.is-loading .kpis, body.is-loading .panels { opacity:.35; pointer-events:none; }\n  .card.outside img { opacity:.45; filter:grayscale(.6); }\n  .badge.out { background:var(--surface-2); color:var(--text-secondary); font-weight:600; font-size:11px; }\n  .card .rm.add { background:var(--accent); display:block; }\n  tr.outside td { color:var(--text-muted); }\n  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }\n  .tablewrap table { min-width:760px; }\n  @media (hover:none) {\n    .card .rm { display:block; width:32px; height:32px; line-height:32px; font-size:18px; }\n    #tip { display:none !important; }\n  }\n  @media (max-width:700px) {\n    .wrap { padding:14px 12px; }\n    h1 { font-size:22px; }\n    h2 { font-size:16px; }\n    .kpis { grid-template-columns:repeat(2,1fr); gap:8px; }\n    .kpi { padding:10px; }\n    .kpi .value { font-size:22px; }\n    .panels, .editor { grid-template-columns:1fr; }\n    .panel { padding:14px; }\n    .hrow { grid-template-columns:96px 1fr 28px; font-size:12px; }\n    .toolbar { position:static; }\n    .row { gap:6px; }\n    input[type=search], #addName { min-width:0 !important; width:100%; }\n    select { width:100%; }\n    .row label { flex:1 1 45%; }\n    .row label input[type=number] { width:100% !important; }\n    .group-label { width:100%; min-width:0; }\n    .chip { padding:6px 11px; }\n    .grid { grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px; }\n    .card .meta { font-size:11px; flex-wrap:wrap; }\n    .tags { display:none; }\n    .hand { grid-template-columns:repeat(4,1fr); }\n    .budget-btns button { min-width:0; flex:1 1 30%; }\n    .tiers { font-size:12px; display:block; overflow-x:auto; }\n    .probs { grid-template-columns:repeat(2,1fr); }\n    textarea { height:220px; }\n  }\n  #tip { position:fixed; pointer-events:none; background:#000d; color:#fff; padding:8px 10px; border-radius:6px; font-size:12px; max-width:320px; z-index:50; display:none; line-height:1.45; }\n<\/style>\n<\/head>\n<body class=\"is-loading\">\n<div id=\"tip\"><\/div>\n<div class=\"loader\"><div id=\"bar\"><\/div><\/div>\n<div class=\"wrap\">\n  <h1>Alela, Cunning Conqueror<\/h1>\n  <p class=\"sub\">Painel do deck: métricas, curva, cores, power level, filtros e lista de importação. Dados e imagens do Scryfall.<\/p>\n  <div class=\"status loading\" id=\"status\"><span class=\"spin\"><\/span><span id=\"statusText\">Carregando dados das cartas no Scryfall...<\/span><\/div>\n\n  \n  <section class=\"panel\" style=\"margin-top:18px\">\n    <h2>Versão do deck e orçamento<\/h2>\n    <div class=\"row\">\n      <label class=\"muted\">Cotação US$ → R$ <input type=\"number\" id=\"rate\" step=\"0.05\" style=\"width:75px\"><\/label>\n      <label class=\"muted\">Fator Brasil <input type=\"number\" id=\"factor\" step=\"0.05\" style=\"width:70px\"><\/label>\n      <label class=\"muted\">Piso por carta R$ <input type=\"number\" id=\"floor\" step=\"0.25\" style=\"width:70px\"><\/label>\n      <label class=\"muted\">Pode passar do valor até <input type=\"number\" id=\"margin\" step=\"1\" min=\"0\" max=\"30\" style=\"width:60px\">%<\/label>\n      <label class=\"muted\"><input type=\"checkbox\" id=\"countBasics\"> Contar terrenos básicos<\/label>\n    <\/div>\n    <p class=\"muted\" style=\"margin:6px 0 0\">Preço por carta = preço colado da LigaMagic, se houver. Senão: preço do Scryfall (impressão mais barata) × cotação × fator Brasil, nunca abaixo do piso. Cartas com preço real aparecem com ✓.<\/p>\n    <details style=\"margin-top:10px\">\n      <summary class=\"muted\" style=\"cursor:pointer\">Usar preços reais da LigaMagic<\/summary>\n      <div class=\"editor\" style=\"margin-top:10px\">\n        <div>\n          <p class=\"muted\" style=\"margin:0 0 6px\"><b>Opção 1, calibrar:<\/b> monte a versão atual na LigaMagic (copie a lista de importação lá embaixo) e digite o total que ela mostrou. A página ajusta o fator Brasil sozinha.<\/p>\n          <div class=\"row\"><input type=\"text\" id=\"calibReal\" placeholder=\"Ex.: 612,40\" style=\"width:120px\"><button id=\"calibBtn\">Calibrar<\/button><\/div>\n          <p class=\"muted\" id=\"calibMsg\"><\/p>\n        <\/div>\n        <div>\n          <p class=\"muted\" style=\"margin:0 0 6px\"><b>Opção 2, colar preços (mais preciso):<\/b> copie a lista de todas as cartas que as versões podem usar, consulte na LigaMagic e cole aqui os preços.<\/p>\n          <div class=\"row\" style=\"margin-bottom:6px\"><button class=\"ghost\" id=\"candBtn\">Copiar lista de todas as candidatas<\/button><span class=\"muted\" id=\"candMsg\"><\/span><\/div>\n          <p class=\"muted\" style=\"margin:0 0 6px\"> uma carta por linha com o preço no fim. Ex.: <code>1 Faerie Mastermind R$ 45,90<\/code><\/p>\n          <textarea id=\"pasteBox\" style=\"height:110px\"><\/textarea>\n          <div class=\"row\" style=\"margin-top:6px\"><label class=\"muted\"><input type=\"checkbox\" id=\"pasteTotal\"> O preço da linha é o total da quantidade<\/label>\n            <button id=\"pasteBtn\">Salvar preços<\/button><button class=\"ghost\" id=\"clearPriceBtn\">Limpar preços colados<\/button><\/div>\n          <p class=\"muted\" id=\"pasteMsg\"><\/p>\n        <\/div>\n      <\/div>\n    <\/details>\n    <div class=\"row\" style=\"margin-top:10px\"><span class=\"group-label\">Proteger<\/span><span id=\"locks\" class=\"row\"><\/span><\/div>\n    <p class=\"muted\" style=\"margin:4px 0 0\">Cartas marcadas nunca saem nas versões de orçamento. A página testa todas as combinações de trocas e escolhe a de maior power que cabe no valor, podendo passar do valor até a porcentagem definida. O power de cada troca vem da % de decks de Alela no EDHREC que jogam cada carta.<\/p>\n    <div class=\"budget-btns\" id=\"budgetBtns\"><\/div>\n    <div id=\"budgetInfo\" class=\"muted\"><\/div>\n    <table class=\"tiers\" id=\"tiers\"><\/table>\n    <div id=\"swapDetail\" style=\"margin-top:12px\"><\/div>\n  <\/section>\n\n  <div class=\"kpis\" id=\"kpis\"><\/div>\n\n  <div class=\"panels\">\n    <div class=\"panel\">\n      <h2>Curva de mana <span class=\"muted\">(sem terrenos, comandante incluso)<\/span><\/h2>\n      <div class=\"vbars\" id=\"curve\"><\/div>\n      <div class=\"vlabels\" id=\"curveLabels\"><\/div>\n      <p class=\"muted\" id=\"curveNote\"><\/p>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Equilíbrio de cores<\/h2>\n      <div class=\"balance\" id=\"balance\"><\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Tipos de carta<\/h2>\n      <div class=\"hbars\" id=\"types\"><\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Funções no deck<\/h2>\n      <div class=\"hbars\" id=\"roles\"><\/div>\n      <p class=\"muted\">Uma carta pode ter mais de uma função.<\/p>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Power level estimado<\/h2>\n      <div id=\"power\"><\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h2>Mão inicial<\/h2>\n      <div class=\"probs\" id=\"probs\"><\/div>\n      <div class=\"row\" style=\"margin-top:12px\">\n        <button id=\"drawBtn\">Comprar 7 cartas<\/button>\n        <span class=\"muted\" id=\"handInfo\"><\/span>\n      <\/div>\n      <div class=\"hand\" id=\"hand\"><\/div>\n    <\/div>\n  <\/div>\n\n\n  <section>\n    <h2>Montar o deck <span class=\"muted\">remova cartas pelo X no canto da imagem e adicione outras aqui<\/span><\/h2>\n    <div class=\"editor\">\n      <div class=\"panel\">\n        <div class=\"row\">\n          <input type=\"search\" id=\"addName\" list=\"addList\" placeholder=\"Nome da carta em inglês\" style=\"min-width:260px\">\n          <datalist id=\"addList\"><\/datalist>\n          <select id=\"addRole\"><option value=\"\">Função (opcional)<\/option><\/select>\n          <button id=\"addBtn\">Adicionar<\/button>\n        <\/div>\n        <p class=\"muted\" id=\"addMsg\"><\/p>\n        <div class=\"row\">\n          <span class=\"pill\" id=\"deckCount\"><\/span>\n          <button class=\"ghost\" id=\"resetBtn\">Voltar para a lista base<\/button>\n        <\/div>\n        <p class=\"muted\">As alterações ficam salvas neste navegador.<\/p>\n      <\/div>\n      <div class=\"panel\">\n        <h2 style=\"font-size:15px\">Alterações em relação à lista base<\/h2>\n        <div class=\"diff\" id=\"diff\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <h2>Cartas<\/h2>\n    <div class=\"toolbar\">\n      <div class=\"row\">\n        <input type=\"search\" id=\"q\" placeholder=\"Buscar por nome ou texto da carta\">\n        <select id=\"sort\">\n          <option value=\"cmc\">Ordenar: custo de mana (menor primeiro)<\/option>\n          <option value=\"cmcDesc\">Ordenar: custo de mana (maior primeiro)<\/option>\n          <option value=\"name\">Ordenar: nome<\/option>\n          <option value=\"type\">Ordenar: tipo<\/option>\n          <option value=\"price\">Ordenar: preço (maior primeiro)<\/option>\n          <option value=\"alela\">Ordenar: % dos decks de Alela<\/option>\n          <option value=\"alelaAsc\">Ordenar: menos jogadas na Alela primeiro<\/option>\n        <\/select>\n        <label class=\"muted\">CMC de <input type=\"number\" id=\"cmcMin\" min=\"0\" max=\"10\" value=\"0\" style=\"width:60px\"><\/label>\n        <label class=\"muted\">até <input type=\"number\" id=\"cmcMax\" min=\"0\" max=\"10\" value=\"10\" style=\"width:60px\"><\/label>\n        <button class=\"ghost\" id=\"viewBtn\">Ver em tabela<\/button>\n        <button class=\"ghost\" id=\"clearBtn\">Limpar filtros<\/button>\n        <span class=\"muted\" id=\"count\"><\/span>\n      <\/div>\n      <div class=\"row\"><span class=\"group-label\">Tipo<\/span><span id=\"typeChips\" class=\"row\"><\/span><\/div>\n      <div class=\"row\"><span class=\"group-label\">Função<\/span><span id=\"roleChips\" class=\"row\"><\/span><\/div>\n      <div class=\"row\"><span class=\"group-label\">Cor<\/span><span id=\"colorChips\" class=\"row\"><\/span>\n        <span class=\"chip\" id=\"instantSpeed\">Jogável no turno do oponente<\/span>\n        <span class=\"chip\" id=\"faerieOnly\">Só Fadas<\/span>\n        <span class=\"chip on\" id=\"onlyDeck\" title=\"Desative para ver também as cartas que saíram da lista base e as opções das versões de orçamento\">Só cartas do deck atual<\/span>\n      <\/div>\n    <\/div>\n    <div id=\"cards\"><\/div>\n  <\/section>\n\n  <section>\n    <h2>Lista para importar <span class=\"muted\">Archidekt, Moxfield, EDHREC, LigaMagic<\/span><\/h2>\n    <textarea id=\"importList\" readonly><\/textarea>\n    <div class=\"row\" style=\"margin-top:10px\">\n      <button id=\"copyBtn\">Copiar lista<\/button>\n      <span class=\"muted\">Se o botão não funcionar, clique na caixa, use Ctrl+A e Ctrl+C.<\/span>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst DECK = [\n  [\"Alela, Cunning Conqueror\",1,[\"Fichas\",\"Goad\",\"Motor\"]],\n  [\"Faerie Seer\",1,[\"Seleção\"]],\n  [\"Spectral Sailor\",1,[\"Compra\"]],\n  [\"Faerie Vandal\",1,[\"Ameaça\"]],\n  [\"Obyra, Dreaming Duelist\",1,[\"Ameaça\",\"Motor\"]],\n  [\"Spellstutter Sprite\",1,[\"Counter\"]],\n  [\"Faerie Mastermind\",1,[\"Compra\"]],\n  [\"Cloud of Faeries\",1,[\"Ramp\"]],\n  [\"Cunning Nightbonder\",1,[\"Motor\"]],\n  [\"Pestermite\",1,[\"Tempo\"]],\n  [\"Quickling\",1,[\"Proteção\",\"Tempo\"]],\n  [\"Scion of Oona\",1,[\"Lorde\", n \"Comandante\";\n  const t = c.type_line || \"\";\n  if (t.includes(\"Land\")) return \"Terreno\";\n  if (t.includes(\"Creature\")) return \"Criatura\";\n  if (t.includes(\"Instant\")) return \"Instantânea\";\n  if (t.includes(\"Sorcery\")) return \"Feitiço\";\n  if (t.includes(\"Artifact\")) return \"Artefato\";\n  if (t.includes(\"Enchantment\")) return \"Encantamento\";\n  return \"Outro\";\n}\nfunction pips(cost){\n  let u = 0, b = 0;\n  for (const m of cost.matchAll(/\\{([^}]+)\\}/g)) {\n    const s = m[1];\n    if (s === \"U\") u++; else if (s === \"B\") b++;\n    else if (s === \"U/B\" || s === \"B/U\") { u += .5; b += .5; }\n  }\n  return {u, b};\n}\nfunction choose(n, k){ if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }\nfunction hyper(N, K, n, k){ return choose(K, k) * choose(N - K, n - k) / choose(N, n); }\n\n// ---------- Status de carregamento ----------\nfunction setStatus(kind, text, progress){\n  const el = $(\"status\");\n  el.className = \"status \" + kind;\n  el.innerHTML = (kind === \"loading\" ? '<span class=\"spin\"><\/span>' : \"\") + `<span id=\"statusText\">${text}<\/span>` +\n    (kind === \"err\" ? ' <button id=\"retryBtn\">Tentar novamente<\/button>' : \"\") +\n    (kind === \"done\" ? ' <button class=\"ghost\" id=\"refreshBtn\">Atualizar preços<\/button>' : \"\");\n  if (progress !== undefined) $(\"bar\").style.width = Math.round(progress * 100) + \"%\";\n  if (kind !== \"loading\") setTimeout(() => $(\"bar\").style.width = \"0\", 600);\n  document.body.classList.toggle(\"is-loading\", kind === \"loading\" && !CARDS.length);\n  $(\"retryBtn\")?.addEventListener(\"click\", () => start(true));\n  $(\"refreshBtn\")?.addEventListener(\"click\", () => start(true));\n}\n\n// ---------- Dados do Scryfall ----------\nconst DATA = {};\nfunction info(c){\n  const face = (c.card_faces || [])[0] || {};\n  const cols = c.colors ?? face.colors ?? [];\n  const kw = c.keywords || [];\n  return {\n    fullName: c.name,\n    cmc: c.cmc || 0,\n    cost: c.mana_cost || face.mana_cost || \"\",\n    typeLine: c.type_line || \"\",\n    oracle: c.oracle_text || (c.card_faces || []).map(f => f.oracle_text).join(\"\\n\"),\n    img: (c.image_uris || face.image_uris || {}).normal || \"\",\n    url: c.scryfall_uri || \"\",\n    price: c.prices && c.prices.usd ? parseFloat(c.prices.usd) : null,\n    rank: c.edhrec_rank || null,\n    gc: !!c.game_changer,\n    instantSpeed: kw.includes(\"Flash\") || (c.type_line || \"\").includes(\"Instant\"),\n    faerie: (c.type_line || \"\").includes(\"Faerie\"),\n    color: cols.length === 0 ? \"Incolor\" : cols.length > 1 ? \"Multicolor\" : cols[0] === \"U\" ? \"Azul\" : cols[0] === \"B\" ? \"Preto\" : \"Outra\",\n    produced: c.produced_mana || [],\n  };\n}\nfunction remember(name, c){\n  const i = info(c);\n  DATA[key(name)] = i;\n  DATA[key(c.name)] = i;\n  DATA[key(c.name.split(\" // \")[0])] = i;\n}\nasync function getJSON(url, tries = 4){\n  let last;\n  for (let t = 0; t < tries; t++) {\n    try {\n      const r = await fetch(url, {headers:{\"Accept\":\"application/json\"}});\n      if (r.status === 404) return {object:\"list\", data:[]};\n      if (r.status === 429 || r.status >= 500) throw new Error(\"Scryfall ocupado (\" + r.status + \")\");\n      if (!r.ok) throw new Error(\"Scryfall respondeu \" + r.status);\n      return await r.json();\n    } catch (e) { last = e; await sleep(800 * (t + 1)); }\n  }\n  throw last;\n}\n// Busca em lotes com GET (sem verificação extra de CORS), com novas tentativas.\nasync function fetchCollection(names){\n  const size = 20, batches = Math.ceil(names.length / size);\n  for (let i = 0; i < names.length; i += size) {\n    const part = names.slice(i, i + size);\n    setStatus(\"loading\", `Carregando cartas do Scryfall: lote ${i / size + 1} de ${batches}`, (i / size) / batches * 0.7);\n    const q = \"(\" + part.map(n => `!\"${n.replace(/\"/g, \"\")}\"`).join(\" or \") + \") game:paper\";\n    let url = \"https://api.scryfall.com/cards/search?q=\" + encodeURIComponent(q);\n    while (url) {\n      const j = await getJSON(url);\n      for (const c of j.data || []) remember(c.name, c);\n      url = j.has_more ? j.next_page : null;\n      await sleep(110);\n    }\n    // mostra o que já chegou, lote a lote\n    CARDS = deck.map(makeCard); renderAll();\n    document.body.classList.remove(\"is-loading\");\n  }\n  // o que não veio na busca exata tenta pelo nome aproximado\n  const notFound = [];\n  for (const n of names.filter(n => !DATA[key(n)])) {\n    try { const c = await getJSON(\"https://api.scryfall.com/cards/named?fuzzy=\" + encodeURIComponent(n), 2); if (c.name) remember(n, c); else notFound.push(n); }\n    catch (_) { notFound.push(n); }\n    await sleep(110);\n  }\n  return notFound;\n}\n// Procura a impressão mais barata (o \"collection\" devolve a impressão padrão, que às vezes é cara)\nasync function cheapest(name){\n  const q = `!\"${name}\" game:paper`;\n  const j = await getJSON(\"https://api.scryfall.com/cards/search?unique=prints&order=usd&dir=asc&q=\" + encodeURIComponent(q), 2);\n  const ok = (j.data || []).filter(c => c.prices && c.prices.usd && c.legalities?.commander === \"legal\").map(c => parseFloat(c.prices.usd));\n  if (ok.length && DATA[key(name)]) DATA[key(name)].price = Math.min(DATA[key(name)].price ?? Infinity, ...ok);\n}\nasync function refinePrices(names){\n  const targets = names.filter(n => (DATA[key(n)]?.price ?? 0) > 1.5);\n  for (let i = 0; i < targets.length; i++) {\n    setStatus(\"loading\", `Cartas carregadas. Buscando a impressão mais barata de cada carta (${i + 1} de ${targets.length}): ${esc(targets[i])}`, 0.7 + (i / targets.length) * 0.3);\n    try { await cheapest(targets[i]); } catch(_){}\n    await sleep(110);\n  }\n}\n\n// ---------- Estado ----------\nlet RATE = load(\"brlRate\") || 5.4;\nlet FACTOR = load(\"brFactorV2\") || 1.6;  // calibrado pelos totais reais informados (R$ 500 → ~R$ 620, R$ 600 → ~R$ 800)   // mercado brasileiro costuma ficar acima da conversão direta\nlet FLOOR = load(\"brFloor\") ?? 1.0;\nlet MARGIN = load(\"brTolerance\") ?? 5;  // % que o deck pode passar do orçamento      // preço mínimo de uma carta avulsa no Brasil\nlet COUNT_BASICS = load(\"countBasics\") || false;\nlet OVERRIDE = load(\"brOverride\") || {}; // preços reais colados da LigaMagic (por nome, em minúsculas)\nconst BASE = DECK.map(([name, qty, roles]) => ({name, qty, roles}));\nlet deck = load(\"alelaDeck\") || BASE.map(e => ({...e}));\ndeck.forEach(e => { if (e.name === \"Picklock Prankster\") { e.name = \"Talion's Messenger\"; e.roles = [\"Seleção\",\"Compra\"]; } });\nlet version = load(\"alelaVersion\") || {label:\"Lista base\", delta:0};\nlet CARDS = [];\nconst state = { q:\"\", sort:\"cmc\", cmcMin:0, cmcMax:10, types:new Set(), roles:new Set(), colors:new Set(), instant:false, faerie:false, table:false, onlyDeck:true };\n\nfunction makeCard(e){\n  const d = DATA[key(e.name)] || {cmc:0, cost:\"\", typeLine:\"\", oracle:\"\", img:\"\", url:\"\", price:null, rank:null, gc:false, instantSpeed:false, faerie:false, color:\"\", produced:[]};\n  return {...d, name:e.name, qty:e.qty, roles:e.roles,\n    type: mainType({type_line:d.typeLine}, e.name),\n    url: d.url || (\"https://scryfall.com/search?q=\" + encodeURIComponent('!\"' + e.name + '\"'))};\n}\nconst isBasic = n => /^(Island|Swamp)$/.test(n);\n// Preço em reais: preço colado da LigaMagic, se houver; senão estimativa = US$ × cotação × fator Brasil, com piso por carta.\nfunction priceOf(n){\n  if (isBasic(n) && !COUNT_BASICS) return 0;\n  if (OVERRIDE[key(n)] !== undefined) return OVERRIDE[key(n)];\n  const usd = DATA[key(n)]?.price;\n  if (usd === null || usd === undefined) return FLOOR;\n  return Math.max(FLOOR, usd * RATE * FACTOR);\n}\nconst isReal = n => OVERRIDE[key(n)] !== undefined;\nconst deckCost = d => d.reduce((s, e) => s + priceOf(e.name) * e.qty, 0);\nfunction save(){ store(\"alelaDeck\", deck); store(\"alelaVersion\", version); }\nfunction rebuild(){ CARDS = deck.map(makeCard); save(); renderAll(); }\n\n// ---------- Orçamento ----------\nlet LOCKED = new Set(load(\"alelaLocked\") || []);\nfunction swapDeltas(){\n  const base = powerOfDeck(BASE).score;\n  SWAPS.forEach(s => {\n    if (!BASE.some(e => e.name === s.out)) { s.d = 0; return; }\n    const d = BASE.map(e => e.name === s.out ? {name:s.in, qty:e.qty, roles:s.roles} : e);\n    s.d = +(powerOfDeck(d).score - base).toFixed(3);\n  });\n}\n// Testa todas as combinações de trocas e fica com a de maior power que cabe no orçamento.\nfunction computeTier(budget){\n  swapDeltas();\n  const d = BASE.map(e => ({...e}));\n  const has = n => d.find(e => e.name === n);\n  const limit = budget * (1 + MARGIN / 100);\n  const base = deckCost(d);\n  const pool = SWAPS.filter(s => has(s.out) && !LOCKED.has(s.out) && (!has(s.in) || /^(Island|Swamp)$/.test(s.in)))\n    .map(s => ({...s, cost: priceOf(s.in) - priceOf(s.out)}));\n  let best = null, cheapest = null;\n  for (let m = 0; m < (1 << pool.length); m++) {\n    let cost = 0, gain = 0, n = 0;\n    for (let i = 0; i < pool.length; i++) if (m & (1 << i)) { cost += pool[i].cost; gain += pool[i].d; n++; }\n    if (!cheapest || cost < cheapest.cost) cheapest = {m, cost, gain};\n    if (base + cost > limit + 1e-9) continue;\n    if (!best || gain > best.gain + 1e-9 || (Math.abs(gain - best.gain) < 1e-9 && (n < best.n || cost < best.cost))) best = {m, cost, gain, n};\n  }\n  const pick = best || cheapest;\n  const chosen = pool.filter((_, i) => pick.m & (1 << i));\n  for (const s of chosen) { const e = has(s.out); e.name = s.in; e.roles = s.roles; }\n  const merged = [];\n  for (const e of d) { const m = merged.find(x => x.name === e.name); if (m) m.qty += e.qty; else merged.push(e); }\n  const total = deckCost(merged);\n  return {deck: merged, applied: chosen, total, fits: total <= limit + 1e-9, delta: chosen.reduce((s, x) => s + x.d, 0)};\n}\n\nfunction renderLocks(){\n  $(\"locks\").innerHTML = \"\";\n  SWAPS.filter(s => s.land === undefined).forEach(s => {\n    const el = document.createElement(\"span\");\n    el.className = \"chip\" + (LOCKED.has(s.out) ? \" on\" : \"\");\n    el.textContent = s.out;\n    el.title = \"Se protegida, nunca sai nas versões de orçamento (substituta: \" + s.in + \"). Alela: \" + pctTxt(s.out) + \" dos decks\";\n    el.onclick = () => { LOCKED.has(s.out) ? LOCKED.delete(s.out) : LOCKED.add(s.out); store(\"alelaLocked\", [...LOCKED]); renderBudget(); };\n    $(\"locks\").appendChild(el);\n  });\n}\n\nlet BASE_SCORE = 0;\nfunction renderBudget(){\n  renderLocks();\n  $(\"budgetBtns\").innerHTML = \"\";\n  const mk = (label, fn, on) => { const b = document.createElement(\"button\"); b.textContent = label; if (on) b.className = \"on\"; b.onclick = fn; $(\"budgetBtns\").appendChild(b); };\n  mk(\"Lista base\", () => { if (!confirmReplace()) return; deck = BASE.map(e => ({...e})); version = {label:\"Lista base\", delta:0}; rebuild(); }, version.label === \"Lista base\");\n  BUDGETS.forEach(b => mk(\"R$ \" + b, () => {\n    if (!confirmReplace()) return;\n    const t = computeTier(b);\n    deck = t.deck; version = {label:\"Orçamento R$ \" + b, delta:t.delta, applied:t.applied.map(s => [s.out, s.in, s.d])};\n    rebuild();\n  }, version.label === \"Orçamento R$ \" + b));\n\n  const baseCost = deckCost(BASE);\n  $(\"budgetInfo\").innerHTML = `Versão atual: <b style=\"color:var(--text-primary)\">${esc(version.label)}<\/b>, custo estimado ${brl(deckCost(deck))}. Lista base: ${brl(baseCost)}. ${Object.keys(OVERRIDE).length} carta(s) com preço real colado.`;\n  $(\"tiers\").innerHTML = `<tr><th>Orçamento<\/th><th>Limite<\/th><th>Custo estimado<\/th><th>Trocas<\/th><th>Power estimado<\/th><th><\/th><\/tr>` +\n    BUDGETS.map(b => {\n      const t = computeTier(b);\n      return `<tr><td>R$ ${b}<\/td><td>${brl(b * (1 + MARGIN / 100))}<\/td><td>${brl(t.total)}<\/td><td>${t.applied.length}<\/td><td>${fmt(powerOfDeck(t.deck).score, 1)}<\/td><td class=\"${t.fits ? \"ok\" : \"bad\"}\">${!t.fits ? \"não cabe nem com todas as trocas\" : t.total <= b ? \"dentro do valor\" : \"até \" + fmt((t.total / b - 1) * 100, 1) + \"% acima\"}<\/td><\/tr>`;\n    }).join(\"\");\n  const ap = version.applied || [];\n  $(\"swapDetail\").innerHTML = ap.length\n    ? `<table class=\"tiers\"><tr><th>Sai<\/th><th>Entra<\/th><th>Decks de Alela (sai → entra)<\/th><th>Budget (sai → entra)<\/th><th>Diferença de preço<\/th><th>Impacto no power<\/th><\/tr>` +\n      ap.map(([o, i, d]) => `<tr><td>${esc(o)}<\/td><td>${esc(i)}<\/td><td>${pctTxt(o)} → ${pctTxt(i)}<\/td><td>${pctBud(o)} → ${pctBud(i)}<\/td><td>${brl(priceOf(i) - priceOf(o))}${isReal(i) && isReal(o) ? \" ✓\" : \"\"}<\/td><td>${d > 0 ? \"ganho\" : Math.abs(d) <= .05 ? \"mínimo\" : Math.abs(d) <= .15 ? \"pequeno\" : \"médio\"} (${d > 0 ? \"+\" : \"\"}${fmt(d, 2)})<\/td><\/tr>`).join(\"\") + `<\/table>`\n    : \"\";\n}\nfunction confirmReplace(){\n  if (version.label === \"Personalizada\") $(\"addMsg\").textContent = \"Suas alterações manuais foram substituídas pela versão escolhida.\";\n  return true;\n}\n$(\"rate\").value = RATE; $(\"factor\").value = FACTOR; $(\"floor\").value = FLOOR; $(\"countBasics\").checked = COUNT_BASICS; $(\"margin\").value = MARGIN;\n$(\"margin\").addEventListener(\"change\", e => { MARGIN = Math.max(0, Math.min(30, parseFloat(e.target.value) || 0)); store(\"brTolerance\", MARGIN); renderAll(); });\n$(\"rate\").addEventListener(\"change\", e => { RATE = parseFloat(e.target.value) || 5.4; store(\"brlRate\", RATE); renderAll(); });\n$(\"factor\").addEventListener(\"change\", e => { FACTOR = parseFloat(e.target.value) || 1; store(\"brFactorV2\", FACTOR); renderAll(); });\n$(\"floor\").addEventListener(\"change\", e => { FLOOR = parseFloat(e.target.value) || 0; store(\"brFloor\", FLOOR); renderAll(); });\n$(\"countBasics\").addEventListener(\"change\", e => { COUNT_BASICS = e.target.checked; store(\"countBasics\", COUNT_BASICS); renderAll(); });\n// Calibrar: o usuário informa o total real (LigaMagic) da versão atual; ajusta o fator sobre as cartas sem preço real.\n$(\"calibBtn\").addEventListener(\"click\", () => {\n  const real = parseFloat(String($(\"calibReal\").value).replace(/\\./g, \"\").replace(\",\", \".\"));\n  if (!real) { $(\"calibMsg\").textContent = \"Informe o valor total que deu na LigaMagic.\"; return; }\n  const fixed = deck.reduce((s, e) => s + (isReal(e.name) ? priceOf(e.name) * e.qty : 0), 0);\n  const est = deck.reduce((s, e) => s + (isReal(e.name) || (isBasic(e.name) && !COUNT_BASICS) ? 0 : priceOf(e.name) * e.qty), 0);\n  if (est <= 0) { $(\"calibMsg\").textContent = \"Todas as cartas já têm preço real colado.\"; return; }\n  const before = FACTOR;\n  FACTOR = Math.max(0.5, Math.min(4, FACTOR * (real - fixed) / est));\n  store(\"brFactorV2\", FACTOR); $(\"factor\").value = FACTOR.toFixed(2);\n  $(\"calibMsg\").textContent = `Fator ajustado de ${fmt(before)} para ${fmt(FACTOR)}. Os orçamentos foram recalculados.`;\n  renderAll();\n});\n// Colar preços da LigaMagic: uma carta por linha, com o preço no fim da linha.\n$(\"pasteBtn\").addEventListener(\"click\", () => {\n  let n = 0;\n  for (const line of $(\"pasteBox\").value.split(/\\n/)) {\n    const m = line.trim().match(/^(?:(\\d+)\\s*x?\\s+)?(.+?)[\\s;:\\t|-]+R?\\$?\\s*([\\d.]*\\d,\\d{2}|\\d+(?:\\.\\d{1,2})?)\\s*$/i);\n    if (!m) continue;\n    const qty = parseInt(m[1] || \"1\", 10);\n    const val = parseFloat(m[3].includes(\",\") ? m[3].replace(/\\./g, \"\").replace(\",\", \".\") : m[3]);\n    const unit = $(\"pasteTotal\").checked ? val / qty : val;\n    OVERRIDE[key(m[2].trim())] = unit; n++;\n  }\n  store(\"brOverride\", OVERRIDE);\n  $(\"pasteMsg\").textContent = n ? `${n} preço(s) real(is) salvos.` : \"Não reconheci nenhuma linha. Formato esperado: 1 Faerie Mastermind R$ 45,90\";\n  renderAll();\n});\n$(\"candBtn\").addEventListener(\"click\", async () => {\n  const names = [...new Set([...BASE.map(e => e.name), ...SWAPS.map(s => s.in), ...deck.map(e => e.name)])].filter(n => !isBasic(n));\n  const txt = names.map(n => \"1 \" + n).join(\"\\n\");\n  try { await navigator.clipboard.writeText(txt); $(\"candMsg\").textContent = names.length + \" cartas copiadas.\"; }\n  catch (_) { $(\"pasteBox\").value = txt; $(\"candMsg\").textContent = \"Não consegui copiar: a lista foi colocada na caixa abaixo.\"; }\n});\n$(\"clearPriceBtn\").addEventListener(\"click\", () => { OVERRIDE = {}; store(\"brOverride\", OVERRIDE); $(\"pasteMsg\").textContent = \"Preços colados removidos.\"; renderAll(); });\n\n// ---------- Editor ----------\nfunction removeOne(name){\n  const e = deck.find(x => x.name === name);\n  if (!e) return;\n  e.qty--; if (e.qty <= 0) deck = deck.filter(x => x !== e);\n  version = {label:\"Personalizada\", delta: version.delta || 0, applied: version.applied};\n  rebuild();\n}\nALL_ROLES.forEach(r => $(\"addRole\").insertAdjacentHTML(\"beforeend\", `<option>${r}<\/option>`));\nlet acTimer;\n$(\"addName\").addEventListener(\"input\", e => {\n  clearTimeout(acTimer);\n  const q = e.target.value.trim();\n  if (q.length < 3) return;\n  acTimer = setTimeout(async () => {\n    try {\n      const r = await fetch(\"https://api.scryfall.com/cards/autocomplete?q=\" + encodeURIComponent(q), {headers:{\"Accept\":\"application/json\"}});\n      const j = await r.json();\n      $(\"addList\").innerHTML = (j.data || []).map(n => `<option value=\"${esc(n)}\">`).join(\"\");\n    } catch(_){}\n  }, 250);\n});\n$(\"addBtn\").addEventListener(\"click\", async () => {\n  const name = $(\"addName\").value.trim().replace(/\\s+/g, \" \");\n  if (!name) return;\n  $(\"addMsg\").textContent = \"Buscando \" + name + \"...\";\n  try {\n    if (!DATA[key(name)]) {\n      const r = await fetch(\"https://api.scryfall.com/cards/named?exact=\" + encodeURIComponent(name), {headers:{\"Accept\":\"application/json\"}});\n      if (!r.ok) { $(\"addMsg\").textContent = \"Carta não encontrada. Use o nome em inglês.\"; return; }\n      const c = await r.json();\n      remember(name, c);\n      if ((DATA[key(name)].price ?? 0) > 1.5) await cheapest(name);\n    }\n    const d = DATA[key(name)];\n    const finalName = d.fullName.split(\" // \")[0];\n    const ci = (d.color === \"Azul\" || d.color === \"Preto\" || d.color === \"Incolor\" || (d.color === \"Multicolor\" && !/[WRG]/.test(d.cost)));\n    const ex = deck.find(x => x.name === finalName);\n    const basic = /^(Island|Swamp)$/.test(finalName);\n    if (ex && !basic) { $(\"addMsg\").textContent = finalName + \" já está no deck (Commander permite só uma cópia).\"; return; }\n    if (ex) ex.qty++; else deck.push({name: finalName, qty:1, roles: $(\"addRole\").value ? [$(\"addRole\").value] : []});\n    version = {label:\"Personalizada\", delta: version.delta || 0, applied: version.applied};\n    $(\"addMsg\").textContent = `${finalName} adicionada (${brl(priceOf(finalName))}).` + (ci ? \"\" : \" Atenção: parece estar fora da identidade de cor azul e preta.\");\n    $(\"addName\").value = \"\";\n    rebuild();\n  } catch (e) { $(\"addMsg\").textContent = \"Erro ao buscar no Scryfall: \" + e.message; }\n});\n$(\"resetBtn\").addEventListener(\"click\", () => { deck = BASE.map(e => ({...e})); version = {label:\"Lista base\", delta:0}; $(\"addMsg\").textContent = \"\"; rebuild(); });\n\nfunction renderEditor(){\n  const total = deck.reduce((s, e) => s + e.qty, 0);\n  $(\"deckCount\").innerHTML = `${total} cartas ` + (total === 100 ? '<span class=\"ok\">✓<\/span>' : `<span class=\"bad\">(${total > 100 ? \"sobram \" + (total - 100) : \"faltam \" + (100 - total)})<\/span>`);\n  const qty = (d, n) => d.find(e => e.name === n)?.qty || 0;\n  const names = [...new Set([...BASE, ...deck].map(e => e.name))];\n  const outs = [], ins = [];\n  for (const n of names) {\n    const diff = qty(deck, n) - qty(BASE, n);\n    if (diff < 0) outs.push(`${-diff} ${n}`);\n    if (diff > 0) ins.push(`${diff} ${n}`);\n  }\n  $(\"diff\").innerHTML = (!outs.length && !ins.length) ? '<span class=\"muted\">Nenhuma alteração.<\/span>' :\n    `<div><b>Saíram<\/b><br>${outs.map(x => `<span class=\"out\">- ${esc(x)}<\/span>`).join(\"<br>\") || '<span class=\"muted\">nada<\/span>'}<\/div>\n     <div style=\"margin-top:8px\"><b>Entraram<\/b><br>${ins.map(x => `<span class=\"in\">+ ${esc(x)}<\/span>`).join(\"<br>\") || '<span class=\"muted\">nada<\/span>'}<\/div>`;\n}\n\n// ---------- Painel ----------\nconst sumQty = list => list.reduce((s, c) => s + c.qty, 0);\nconst withRole = r => CARDS.filter(c => c.roles.includes(r));\n\nfunction metrics(){\n  const nonLand = CARDS.filter(c => c.type !== \"Terreno\");\n  return {\n    nonLand, lands: CARDS.filter(c => c.type === \"Terreno\"),\n    total: sumQty(CARDS),\n    avgCmc: nonLand.reduce((s, c) => s + c.cmc * c.qty, 0) / Math.max(sumQty(nonLand), 1),\n    ramp: sumQty(withRole(\"Ramp\")),\n    draw: sumQty(CARDS.filter(c => c.roles.includes(\"Compra\") || c.roles.includes(\"Seleção\"))),\n    interaction: sumQty(CARDS.filter(c => c.roles.some(r => INTERACTION.includes(r)))),\n    counters: sumQty(withRole(\"Counter\")), removal: sumQty(withRole(\"Remoção\")), bounce: sumQty(withRole(\"Bounce\")),\n    instantSpeed: sumQty(CARDS.filter(c => c.instantSpeed)),\n    faeries: sumQty(CARDS.filter(c => c.faerie && c.type !== \"Terreno\")),\n    gcs: CARDS.filter(c => c.gc),\n  };\n}\n// Power linear: cada carta soma um pouco (sem faixas), então mais orçamento nunca reduz a nota.\nconst W = { cmc:-1.4, ramp:0.05, draw:0.04, interaction:0.07, instant:0.017, gc:0.5, quality:0.006 };\nfunction cardsOf(entries){ return entries.map(makeCard); }\nfunction metricsOf(cards){\n  const nonLand = cards.filter(c => c.type !== \"Terreno\");\n  const n = Math.max(nonLand.reduce((s, c) => s + c.qty, 0), 1);\n  const cnt = f => cards.filter(f).reduce((s, c) => s + c.qty, 0);\n  return {\n    avgCmc: nonLand.reduce((s, c) => s + c.cmc * c.qty, 0) / n,\n    ramp: cnt(c => c.roles.includes(\"Ramp\")),\n    draw: cnt(c => c.roles.includes(\"Compra\") || c.roles.includes(\"Seleção\")),\n    interaction: cnt(c => c.roles.some(r => INTERACTION.includes(r))),\n    instantSpeed: cnt(c => c.instantSpeed),\n    gcs: cards.filter(c => c.gc),\n    quality: nonLand.filter(c => c.name !== COMMANDER).reduce((s, c) => s + edhScore(c.name) * c.qty, 0),\n    landAdj: SWAPS.filter(sw => sw.land !== undefined && cards.some(c => c.name === sw.in) && !cards.some(c => c.name === sw.out)).reduce((s, sw) => s + sw.land, 0),\n  };\n}\nfunction powerOfDeck(entries){\n  const m = metricsOf(cardsOf(entries));\n  const BASE_QUALITY = metricsOf(cardsOf(BASE)).quality; // recalculado sempre: depende dos dados já carregados\n  const f = [];\n  let score = 0;\n  const add = (label, pts, detail) => { score += pts; f.push([label, pts, detail]); };\n  add(\"Base de um deck de Commander montado\", 2.6, \"ponto de partida\");\n  add(\"Curva de mana\", (m.avgCmc - 3) * W.cmc, \"CMC médio \" + fmt(m.avgCmc) + \", cada 0,1 abaixo de 3 soma 0,14\");\n  add(\"Ramp\", m.ramp * W.ramp, m.ramp + \" peças × 0,05\");\n  add(\"Compra e seleção\", m.draw * W.draw, m.draw + \" cartas × 0,04\");\n  add(\"Interação\", m.interaction * W.interaction, m.interaction + \" cartas × 0,07\");\n  add(\"Jogo no turno do oponente\", m.instantSpeed * W.instant, m.instantSpeed + \" cartas × 0,017\");\n  add(\"Game Changers\", m.gcs.length * W.gc, m.gcs.length + \" carta(s) × 0,5\");\n  add(\"Qualidade das cartas vs lista base\", (m.quality - BASE_QUALITY) * W.quality + m.landAdj, \"pela % de uso no EDHREC\");\n  add(\"Orçamento econômico\", -0.5, \"sem fetch, shock ou dual originais\");\n  return {score: Math.max(1, Math.min(10, score)), f, m};\n}\n\nfunction renderAll(){\n  const m = metrics();\n  // power da lista base (para a tabela de orçamentos)\n\n  const total = deckCost(deck);\n  const missing = CARDS.filter(c => c.price === null && !isReal(c.name) && c.type !== \"Terreno\").length;\n  const realN = CARDS.filter(c => isReal(c.name)).length;\n  const kpis = [\n    [\"Cartas\", m.total, m.total === 100 ? \"Lista completa\" : \"Atenção: deveria ser 100\"],\n    [\"CMC médio\", fmt(m.avgCmc), \"sem terrenos\"],\n    [\"Terrenos\", sumQty(m.lands), \"+\" + m.ramp + \" peças de ramp\"],\n    [\"Compra e seleção\", m.draw, \"cartas que geram ou filtram cartas\"],\n    [\"Interação\", m.interaction, m.counters + \" counters, \" + m.removal + \" remoções, \" + m.bounce + \" bounces\"],\n    [\"No turno do oponente\", m.instantSpeed, \"flash + instantâneas (dispara Alela)\"],\n    [\"Fadas\", m.faeries, \"criaturas do tipo Fada\"],\n    [\"Game Changers\", m.gcs.length, m.gcs.length ? m.gcs.map(c => c.name).join(\", \") : \"nenhum na lista oficial\"],\n    [\"Preço estimado\", brl(total), (realN ? realN + \" com preço real da LigaMagic\" : \"estimativa pelo Scryfall\") + (missing ? `, ${missing} sem preço` : \"\") + (COUNT_BASICS ? \"\" : \", sem básicos\")],\n  ];\n  $(\"kpis\").innerHTML = kpis.map(([l, v, n]) => `<div class=\"kpi\"><div class=\"label\">${l}<\/div><div class=\"value\">${v}<\/div><div class=\"note\">${esc(n)}<\/div><\/div>`).join(\"\");\n\n  renderCurve(m.nonLand);\n  renderBalance(m.nonLand);\n  renderBars(\"types\", TYPE_ORDER.map(t => [t, CARDS.filter(c => c.type === t)]));\n  const roleNames = [...new Set(CARDS.flatMap(c => c.roles))];\n  renderBars(\"roles\", roleNames.map(r => [r, withRole(r)]).sort((a, b) => sumQty(b[1]) - sumQty(a[1])));\n  renderPower(m);\n  renderProbs(m.lands, m.ramp);\n  resetFilters(false);\n  buildChips(roleNames);\n  renderCards();\n  renderEditor();\n  renderBudget();\n  $(\"importList\").value = deck.map(e => `${e.qty} ${e.name}`).join(\"\\n\");\n}\n\nfunction renderCurve(nonLand){\n  const buckets = [0,1,2,3,4,5,6,7];\n  const groups = buckets.map(b => nonLand.filter(c => b === 7 ? c.cmc >= 7 : Math.floor(c.cmc) === b));\n  const max = Math.max(...groups.map(g => sumQty(g)), 1);\n  $(\"curve\").innerHTML = \"\";\n  groups.forEach((g, i) => {\n    const n = sumQty(g);\n    const col = document.createElement(\"div\");\n    col.className = \"vbar\";\n    col.innerHTML = `<div class=\"num\">${n}<\/div><div class=\"bar\" style=\"height:${n / max * 85}%\"><\/div>`;\n    hover(col, `<b>CMC ${i === 7 ? \"7+\" : i}: ${n} carta(s)<\/b><br>${g.map(c => esc(c.name)).join(\"<br>\") || \"nenhuma\"}`);\n    $(\"curve\").appendChild(col);\n  });\n  $(\"curveLabels\").innerHTML = buckets.map(b => `<div>${b === 7 ? \"7+\" : b}<\/div>`).join(\"\");\n  const low = sumQty(nonLand.filter(c => c.cmc <= 2));\n  $(\"curveNote\").textContent = `${low} de ${sumQty(nonLand)} mágicas custam 2 ou menos (${pct(low / Math.max(sumQty(nonLand), 1))}). Passe o mouse nas barras para ver as cartas.`;\n}\n\nfunction renderBalance(nonLand){\n  let pu = 0, pb = 0;\n  nonLand.forEach(c => { const p = pips(c.cost); pu += p.u * c.qty; pb += p.b * c.qty; });\n  const landSrc = {u:0, b:0}, allSrc = {u:0, b:0};\n  CARDS.forEach(c => {\n    let u = c.produced.includes(\"U\"), b = c.produced.includes(\"B\");\n    if (c.name === \"Evolving Wilds\") u = b = true; // busca básico de qualquer cor\n    if (c.type === \"Terreno\") { if (u) landSrc.u += c.qty; if (b) landSrc.b += c.qty; }\n    if (u) allSrc.u += c.qty; if (b) allSrc.b += c.qty;\n  });\n  const shareU = pu / Math.max(pu + pb, 1);\n  const isl = CARDS.find(c => c.name === \"Island\")?.qty || 0;\n  const swp = CARDS.find(c => c.name === \"Swamp\")?.qty || 0;\n  const idealIsl = Math.round((isl + swp) * shareU);\n  const split = (a, b, la, lb) => {\n    const t = Math.max(a + b, 1), sa = a / t;\n    return `<div class=\"split\"><div style=\"width:${sa * 100}%;background:var(--series-1)\">${la} ${pct(sa)}<\/div><div style=\"width:${(1 - sa) * 100}%;background:var(--series-7)\">${lb} ${pct(1 - sa)}<\/div><\/div>`;\n  };\n  $(\"balance\").innerHTML = `\n    <div class=\"legend\"><span><span class=\"sw\" style=\"background:var(--series-1)\"><\/span>Azul<\/span><span><span class=\"sw\" style=\"background:var(--series-7)\"><\/span>Preto<\/span><\/div>\n    <div><div class=\"muted\">Símbolos de mana nas mágicas (${fmt(pu,1)} azuis, ${fmt(pb,1)} pretos)<\/div>${split(pu, pb, \"Azul\", \"Preto\")}<\/div>\n    <div><div class=\"muted\">Terrenos que geram cada cor (${landSrc.u} azuis, ${landSrc.b} pretos; terrenos duplos contam nas duas)<\/div>${split(landSrc.u, landSrc.b, \"Azul\", \"Preto\")}<\/div>\n    <div><div class=\"muted\">Básicos (${isl} Ilhas, ${swp} Pântanos)<\/div>${split(isl, swp, \"Ilhas\", \"Pântanos\")}<\/div>\n    <p class=\"muted\" style=\"margin:0\">Pela proporção de símbolos, o ideal seriam cerca de <b style=\"color:var(--text-primary)\">${idealIsl} Ilhas e ${isl + swp - idealIsl} Pântanos<\/b>.\n    ${Math.abs(idealIsl - isl) <= 1 ? \"A divisão atual está adequada.\" : \"Vale ajustar os básicos.\"}\n    Contando artefatos de mana, são ${allSrc.u} fontes de azul e ${allSrc.b} de preto.<\/p>`;\n}\n\nfunction renderBars(id, rows){\n  const max = Math.max(...rows.map(r => sumQty(r[1])), 1);\n  $(id).innerHTML = \"\";\n  rows.filter(r => sumQty(r[1]) > 0).forEach(([label, list]) => {\n    const n = sumQty(list);\n    const row = document.createElement(\"div\");\n    row.className = \"hrow\";\n    row.innerHTML = `<div>${esc(label)}<\/div><div class=\"track\"><div class=\"fill\" style=\"width:${n / max * 100}%\"><\/div><\/div><div class=\"n\">${n}<\/div>`;\n    hover(row, `<b>${esc(label)}: ${n}<\/b><br>${list.map(c => esc(c.name) + (c.qty > 1 ? \" x\" + c.qty : \"\")).join(\"<br>\")}`);\n    $(id).appendChild(row);\n  });\n}\n\nfunction renderPower(m){\n  const {score, f} = powerOfDeck(deck);\n  const bracket = m.gcs.length === 0 ? \"2 a 3\" : m.gcs.length <= 3 ? \"3\" : \"4\";\n  $(\"power\").innerHTML = `\n    <div class=\"power-score\"><span class=\"big\">${fmt(score,1)}<\/span><span class=\"muted\">/ 10 (estimativa)<\/span><\/div>\n    <div class=\"muted\">Bracket oficial provável: <b style=\"color:var(--text-primary)\">${bracket}<\/b>. ${m.gcs.length ? \"Tem Game Changers: \" + m.gcs.map(c => esc(c.name)).join(\", \") + \".\" : \"Sem Game Changers.\"}<\/div>\n    <ul class=\"factors\">${f.map(([l, p, d]) => `<li><span>${l} <span class=\"muted\">(${esc(d)})<\/span><\/span><b>${p > 0 ? \"+\" : \"\"}${fmt(p,2)}<\/b><\/li>`).join(\"\")}<\/ul>\n    <p class=\"muted\">Cálculo próprio deste painel, para comparar versões do deck: cada carta soma um pouco, então um orçamento maior nunca dá nota menor. O bracket segue a regra pública de Game Changers; o número de 1 a 10 é uma heurística, não uma métrica oficial.<\/p>`;\n}\n\nfunction renderProbs(lands, ramp){\n  const N = Math.max(sumQty(CARDS) - 1, 7), n = 7, K = sumQty(lands);\n  let p24 = 0, p01 = 0, p5 = 0;\n  for (let k = 0; k <= 7; k++) { const p = hyper(N, K, n, k); if (k >= 2 && k <= 4) p24 += p; else if (k <= 1) p01 += p; else p5 += p; }\n  const engines = sumQty(CARDS.filter(c => c.roles.includes(\"Compra\") && c.type !== \"Instantânea\" && c.type !== \"Feitiço\"));\n  $(\"probs\").innerHTML = [\n    [\"2 a 4 terrenos\", p24, \"mão mantível\"],\n    [\"0 ou 1 terreno\", p01, \"mulligan provável\"],\n    [\"5+ terrenos\", p5, \"mão inundada\"],\n    [\"Pelo menos 1 ramp\", 1 - hyper(N, ramp, n, 0), ramp + \" no deck\"],\n    [\"Pelo menos 1 motor de compra permanente\", 1 - hyper(N, engines, n, 0), engines + \" no deck\"],\n  ].map(([l, p, x]) => `<div class=\"prob\"><span class=\"muted\">${l}<\/span><b>${pct(p)}<\/b><span class=\"muted\">${x}<\/span><\/div>`).join(\"\");\n}\n\n$(\"drawBtn\").addEventListener(\"click\", () => {\n  const library = [];\n  CARDS.filter(c => c.name !== COMMANDER).forEach(c => { for (let i = 0; i < c.qty; i++) library.push(c); });\n  for (let i = library.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [library[i], library[j]] = [library[j], library[i]]; }\n  const hand = library.slice(0, 7).sort((a, b) => a.cmc - b.cmc);\n  const nl = hand.filter(c => c.type === \"Terreno\").length;\n  $(\"hand\").innerHTML = hand.map(c => `<a href=\"${c.url}\" target=\"_blank\" rel=\"noopener\"><img src=\"${c.img}\" alt=\"${esc(c.name)}\" title=\"${esc(c.name)}\"><\/a>`).join(\"\");\n  $(\"handInfo\").textContent = `${nl} terreno(s). ${nl >= 2 && nl <= 4 ? \"Mão mantível pela contagem de terrenos.\" : \"Pela contagem de terrenos, considere mulligan.\"}`;\n});\n\n// ---------- Filtros ----------\nfunction chip(label, count, onClick){\n  const el = document.createElement(\"span\");\n  el.className = \"chip\";\n  el.innerHTML = `${esc(label)}<span class=\"c\">${count}<\/span>`;\n  el.addEventListener(\"click\", () => { el.classList.toggle(\"on\"); onClick(el.classList.contains(\"on\")); renderCards(); });\n  return el;\n}\nfunction buildChips(roleNames){\n  $(\"typeChips\").innerHTML = \"\"; $(\"roleChips\").innerHTML = \"\"; $(\"colorChips\").innerHTML = \"\";\n  TYPE_ORDER.forEach(t => { const n = sumQty(CARDS.filter(c => c.type === t)); if (n) $(\"typeChips\").appendChild(chip(t, n, on => on ? state.types.add(t) : state.types.delete(t))); });\n  roleNames.sort().forEach(r => $(\"roleChips\").appendChild(chip(r, sumQty(withRole(r)), on => on ? state.roles.add(r) : state.roles.delete(r))));\n  [\"Azul\",\"Preto\",\"Multicolor\",\"Incolor\"].forEach(k => { const n = sumQty(CARDS.filter(c => c.color === k)); if (n) $(\"colorChips\").appendChild(chip(k, n, on => on ? state.colors.add(k) : state.colors.delete(k))); });\n}\nfunction resetFilters(render = true){\n  Object.assign(state, {q:\"\", cmcMin:0, cmcMax:10, instant:false, faerie:false});\n  state.types.clear(); state.roles.clear(); state.colors.clear();\n  $(\"q\").value = \"\"; $(\"cmcMin\").value = 0; $(\"cmcMax\").value = 10;\n  document.querySelectorAll(\".chip.on\").forEach(c => { if (c.id !== \"onlyDeck\") c.classList.remove(\"on\"); });\n  if (render) renderCards();\n}\n$(\"instantSpeed\").addEventListener(\"click\", e => { state.instant = !state.instant; e.currentTarget.classList.toggle(\"on\", state.instant); ren ction moveTip(e){ tip.style.left = Math.min(e.clientX + 14, innerWidth - 330) + \"px\"; tip.style.top = (e.clientY + 14) + \"px\"; }\nfunction hideTip(){ tip.style.display = \"none\"; }\nfunction hover(el, html){ el.addEventListener(\"mouseenter\", e => showTip(e, html)); el.addEventListener(\"mousemove\", moveTip); el.addEventListener(\"mouseleave\", hideTip); }\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst pct = x => (x * 100).toFixed(1).replace(\".\", \",\") + \"%\";\nconst fmt = (x, d = 2) => x.toFixed(d).replace(\".\", \",\");\nconst brl = v => \"R$ \" + fmt(v);\nconst key = n => n.toLowerCase();\nconst pctTxt = n => { const e = EDH[n]; return e && e[0] !== null ? fmt(e[0], 0) + \"%\" : \"<5%\"; };\nconst pctBud = n => { const e = EDH[n]; return e && e[1] !== null ? fmt(e[1], 0) + \"%\" : \"<5%\"; };\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nfunction store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }\nfunction load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(_) { return null; } }\n\nfunction mainType(c, name){\n  if (name === COMMANDER) return \"Comandante\";\n  const t = c.type_line || \"\";\n  if (t.includes(\"Land\")) return \"Terreno\";\n  if (t.includes(\"Creature\")) return \"Criatura\";\n  if (t.includes(\"Instant\")) return \"Instantânea\";\n  if (t.includes(\"Sorcery\")) return \"Feitiço\";\n  if (t.includes(\"Artifact\")) return \"Artefato\";\n  if (t.includes(\"Enchantment\")) return \"Encantamento\";\n  return \"Outro\";\n}\nfunction pips(cost){\n  let u = 0, b = 0;\n  for (const m of cost.matchAll(/\\{([^}]+)\\}/g)) {\n    const s = m[1];\n    if (s === \"W\") u++; else if (s === \"U\") b++;\n    else if (s === \"W/U\" || s === \"U/W\") { u += .5; b += .5; }\n  }\n  return {u, b};\n}\nfunction choose(n, k){ if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }\nfunction hyper(N, K, n, k){ return choose(K, k) * choose(N - K, n - k) / choose(N, n); }\n\n// ---------- Status de carregamento ----------\nfunction setStatus(kind, text, progress){\n  const el = $(\"status\");\n  el.className = \"status \" + kind;\n  el.innerHTML = (kind === \"loading\" ? '<span class=\"spin\"><\/span>' : \"\") + `<span id=\"statusText\">${text}<\/span>` +\n    (kind === \"err\" ? ' <button id=\"retryBtn\">Tentar novamente<\/button>' : \"\") +\n    (kind === \"done\" ? ' <button class=\"ghost\" id=\"refreshBtn\">Atualizar preços<\/button>' : \"\");\n  if (progress !== undefined) $(\"bar\").style.width = Math.round(progress * 100) + \"%\";\n  if (kind !== \"loading\") setTimeout(() => $(\"bar\").style.width = \"0\", 600);\n  document.body.classList.toggle(\"is-loading\", kind === \"loading\" && !CARDS.length);\n  $(\"retryBtn\")?.addEventListener(\"click\", () => start(true));\n  $(\"refreshBtn\")?.addEventListener(\"click\", () => start(true));\n}\n\n// ---------- Dados do Scryfall ----------\nconst DATA = {};\nfunction info(c){\n  const face = (c.card_faces || [])[0] || {};\n  const cols = c.colors ?? face.colors ?? [];\n  const kw = c.keywords || [];\n  return {\n    fullName: c.name,\n    cmc: c.cmc || 0,\n    cost: c.mana_cost || face.mana_cost || \"\",\n    typeLine: c.type_line || \"\",\n    oracle: c.oracle_text || (c.card_faces || []).map(f => f.oracle_text).join(\"\\n\"),\n    img: (c.image_uris || face.image_uris || {}).normal || \"\",\n    url: c.scryfall_uri || \"\",\n    price: c.prices && c.prices.usd ? parseFloat(c.prices.usd) : null,\n    rank: c.edhrec_rank || null,\n    gc: !!c.game_changer,\n    instantSpeed: kw.includes(\"Flash\") || (c.type_line || \"\").includes(\"Instant\"),\n    faerie: (c.type_line || \"\").includes(\"Spirit\") || (c.keywords || []).includes(\"Changeling\"),\n    color: cols.length === 0 ? \"Incolor\" : cols.length > 1 ? \"Multicolor\" : cols[0] === \"W\" ? \"Branco\" : cols[0] === \"U\" ? \"Azul
